services:
  - type: web
    name: hrms-saas-platform
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run render:build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
